const q=new URLSearchParams(location.hash.slice(1));
const X=T[q.get('l')]||T.ru;
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Date.UTC(+m[1],m[2]-1,+m[3]):null};
const now=new Date(), today=pd(q.get('d'))||Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()), DAY=864e5;
// group mode: m=Name~YYYY-MM-DD|Name~YYYY-MM-DD ; single mode: b=YYYY-MM-DD

function draw(){

}
const svg=el('c');
function pick(ev){const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(N-1,Math.floor((px-L)/CW))),ns=center-BEFORE+i;
  if(ns!==sel){sel=ns;draw();try{Telegram.WebApp.HapticFeedback.selectionChanged()}catch(e){}}}
let down=false;
svg.addEventListener('pointerdown',e=>{down=true;svg.setPointerCapture(e.pointerId);pick(e)});
svg.addEventListener('pointermove',e=>{if(down)pick(e)});
svg.addEventListener('pointerup',()=>down=false);svg.addEventListener('pointercancel',()=>down=false);
el('pv').onclick=()=>{center-=7;sel-=7;draw()};el('nx').onclick=()=>{center+=7;sel+=7;draw()};el('td').onclick=()=>{center=0;sel=0;draw()};
try{Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.setHeaderColor('#f8f4ea');Telegram.WebApp.setBackgroundColor('#f8f4ea')}catch(e){}
tabs(); draw();
</script></body></html>
